name: portal-nightly

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: portal/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm supabase start
      - name: Configure local end-to-end environment
        run: |
          pnpm supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\nSUPABASE_SECRET_KEY=%s\nNEXT_PUBLIC_APP_URL=http://127.0.0.1:3100\nE2E_TEST_MODE=true\nE2E_DEMO_PASSWORD=Nivaa-demo-2026!\n' "$API_URL" "$PUBLISHABLE_KEY" "$SECRET_KEY" > .env.local
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit --run
      - run: pnpm test:integration --run
      - run: pnpm test:rls
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm audit --prod --audit-level high
      - if: always()
        run: pnpm supabase stop
