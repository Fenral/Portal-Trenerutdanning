<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#39724E">
  <title>Trenerutdanningsportalen · klikkbar demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Hopp til innhold</a>

  <header class="app-bar">
    <div class="brand" aria-label="Norges Golfforbund – Trenerutdanningsportalen">
      <span class="brand-mark" aria-hidden="true"><span></span></span>
      <span class="brand-copy">
        <strong>Trenerutdanning</strong>
        <small>Norges Golfforbund</small>
      </span>
    </div>

    <div class="demo-context" aria-label="Demoinformasjon">
      <span class="demo-badge">Demo</span>
      <span class="demo-date">30. august 2026</span>
    </div>

    <nav class="role-switcher" aria-label="Velg rolle">
      <button class="role-button is-active" type="button" data-role="student" aria-pressed="true">
        <span class="role-icon-static" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M3 7l7-4 7 4-7 4zM5.5 9.5V14c2.5 1.8 6.5 1.8 9 0V9.5"/></svg></span><span class="role-name">Student</span>
      </button>
      <button class="role-button" type="button" data-role="teacher" aria-pressed="false">
        <span class="role-icon-static" aria-hidden="true"><svg viewBox="0 0 20 20"><circle cx="7" cy="7" r="2.5"/><circle cx="14" cy="8" r="2"/><path d="M2.5 16c.2-3.7 1.8-5.6 4.5-5.6s4.3 1.9 4.5 5.6M11 15.5c.3-2.7 1.4-4.1 3.2-4.1 2 0 3 1.5 3.3 4.1"/></svg></span><span class="role-name">Lærer</span>
      </button>
      <button class="role-button" type="button" data-role="admin" aria-pressed="false">
        <span class="role-icon-static" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M3.5 16.5h13M5 15V9h3v6M9 15V4h3v11M13 15V7h3v8"/></svg></span><span class="role-name">Administrator</span>
      </button>
    </nav>

    <button class="reset-button" type="button" data-action="reset-demo" title="Tilbakestill demoen">
      Tilbakestill
    </button>
  </header>

  <div class="app-shell">
    <aside class="course-sidebar" id="course-sidebar" aria-label="Kursnavigasjon"></aside>
    <main class="main-workspace" id="main" tabindex="-1"></main>
  </div>

  <div class="drawer-backdrop" data-action="close-drawer" hidden></div>
  <aside class="detail-drawer" aria-label="Detaljer" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <span class="eyebrow">Detaljer</span>
        <h2 id="drawer-title">Detaljer</h2>
      </div>
      <button class="icon-button" type="button" data-action="close-drawer" aria-label="Lukk detaljer"><svg aria-hidden="true" viewBox="0 0 18 18"><path d="M5 5l8 8M13 5l-8 8"/></svg></button>
    </div>
    <div class="drawer-content" id="drawer-content"></div>
  </aside>

  <div class="modal-backdrop" data-action="close-modal" hidden></div>
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
    <div class="modal-header">
      <div>
        <span class="eyebrow" id="modal-eyebrow">Demo</span>
        <h2 id="modal-title">Dialog</h2>
      </div>
      <button class="icon-button" type="button" data-action="close-modal" aria-label="Lukk dialog"><svg aria-hidden="true" viewBox="0 0 18 18"><path d="M5 5l8 8M13 5l-8 8"/></svg></button>
    </div>
    <div class="modal-content" id="modal-content"></div>
  </section>

  <div class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js"></script>
</body>
</html>
